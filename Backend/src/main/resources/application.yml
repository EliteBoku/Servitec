spring:
  application:
    name: servitec-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:33061/servitec_db?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8}
    username: ${DB_USERNAME:servitec_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Bogota

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:no-reply@servitec.local}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    time-zone: America/Bogota
    locale: es_CO

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: servitec-backend
      access-token-expiration-minutes: 15
      inactivity-timeout-minutes: 60
      refresh-token-expiration-days: 7
    account-token:
      activation-expiration-hours: 24
      password-reset-expiration-minutes: 30
    refresh-cookie:
      secure: ${COOKIE_SECURE:false}
      same-site: Lax
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      nombre: ${BOOTSTRAP_ADMIN_NAME:}
      correo: ${BOOTSTRAP_ADMIN_EMAIL:}
      contrasena: ${BOOTSTRAP_ADMIN_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}