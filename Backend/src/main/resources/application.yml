spring:
  application:
    name: servitec-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:33061/servitec_db?serverTimezone=America/Bogota&useSSL=false}
    username: ${DB_USERNAME:servitec_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080
